name: Verify

on:
  pull_request:
    # #54086: no `edited`; a title or body edit restarted the run, and cancel-in-progress cancelled the one under way.
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    # #54086: the 3-CPU macos-latest runner timed out fixture-heavy tests at 30 s on every delivery (PRs 19-21).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
          cache: pnpm
      - name: Frozen installs, lint, types and all test suites
        run: pnpm verify
